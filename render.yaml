services:
  - type: web
    name: colaciones-cl
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      # Rewrite all routes to index.html for React Router compatibility
      - type: rewrite
        source: /*
        destination: /index.html
